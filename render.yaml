services:
  - type: web
    name: quickbite
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/menu
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: PAYMENT_MODE
        value: mock
      - key: DB_HOST
        fromDatabase:
          name: quickbite-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: quickbite-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: quickbite-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: quickbite-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: quickbite-db
          property: password

databases:
  - name: quickbite-db
    plan: free
    region: singapore
    databaseName: quickbite
    user: quickbite
