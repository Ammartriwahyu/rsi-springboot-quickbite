# Profil PostgreSQL sesuai slide 30.
# Jalankan: mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Butuh database "quickbite" dan user "quickbite"; password diambil dari env DB_PASSWORD.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/quickbite
    username: quickbite
    password: ${DB_PASSWORD}
  h2:
    console:
      enabled: false
