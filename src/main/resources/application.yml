server:
  port: ${PORT:8080}

spring:
  application:
    name: quickbite
  datasource:
    url: jdbc:h2:mem:quickbite;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

quickbite:
  payment:
    mode: ${PAYMENT_MODE:mock}
    base-url: ${PAYMENT_BASE_URL:https://api.midtrans.com}
