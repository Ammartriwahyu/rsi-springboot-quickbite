# Konfigurasi default: database H2 in-memory, langsung jalan tanpa instalasi.
# Untuk PostgreSQL, jalankan dengan profil "postgres" (lihat application-postgres.yml).
server:
  port: 8080

spring:
  application:
    name: quickbite
  datasource:
    url: jdbc:h2:mem:quickbite;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  h2:
    console:
      enabled: true        # lihat isi tabel di http://localhost:8080/h2-console
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate   # skema dibuat oleh Flyway, Hibernate hanya mengecek
    open-in-view: false    # entity tidak boleh lazy-load di Boundary
  flyway:
    enabled: true

quickbite:
  payment:
    # mock     = gateway tiruan (default, tanpa internet)
    # midtrans = adapter HTTP dari slide 19 (hanya ilustrasi)
    mode: ${PAYMENT_MODE:mock}
    base-url: ${PAYMENT_BASE_URL:https://api.midtrans.com}
